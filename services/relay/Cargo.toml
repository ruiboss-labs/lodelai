[package]
name = "lodelai-relay"
description = "lodelai 중계 서버 (U4, #56). 라이브러리(axum Router) + 얇은 main. M1 로컬(앱 자식 프로세스) → M2 hosted 와 같은 코드 경로"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lodelai-relay"
path = "src/main.rs"

[dependencies]
lodelai-crypto = { path = "../../crates/crypto" }
lodelai-effects = { path = "../../crates/effects" }
lodelai-statechart = { path = "../../crates/statechart" }
lodelai-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
# 가입 메일(Resend HTTPS, 묶음 5) — relay-client 와 같은 TLS 묶음: 암호 공급자 ring, 루트 webpki-roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "0.26"
# 운영자 SMTP(묶음 29 §1-3) — 막는 전송(가입 메일은 spawn_blocking 안), TLS 는 rustls·ring·webpki 루트.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# 모바일 푸시(APNs·FCM, 모바일 검증): APNs 는 HTTP/2 만 받아 h2 클라이언트를 직접 쓴다(TLS 는 위 rustls·ALPN h2).
# JWT 서명(APNs ES256·FCM 서비스 계정 RS256)은 rustls 가 이미 쓰는 ring 으로.
h2 = "0.4"
http = "1"
bytes = "1"
ring = "0.17"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
rustix = { version = "1", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 묶음 22 MLS 전달 서비스: 그룹마다 비밀 없는 공개 상태(PublicGroup)로 Commit 을 검증·적용한다(relay-client 와 같은 판).
openmls = "=0.8.3"
openmls_traits = "0.5"
openmls_rust_crypto = "0.5"
openmls_memory_storage = "0.5"

[dev-dependencies]
lodelai-testkit = { path = "../../crates/testkit" }
# 묶음 22 시험: 클라이언트와 같은 MLS 프로필로 실제 KeyPackage·Commit 을 만든다.
lodelai-relay-client = { path = "../../crates/relay-client" }
tokio-tungstenite = "0.30"
tempfile = "3"

[lints]
workspace = true
