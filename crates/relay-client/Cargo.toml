[package]
name = "lodelai-relay-client"
description = "코어 ↔ 중계 서버 클라이언트 (U5, #57): WS 인증·서명·영속 송신 큐·수신 재검증(TOFU 기기 키)·로컬 relay 자식 프로세스·기기 등록. lodelai-core 에 의존하지 않는다"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true
rust-version.workspace = true

[dependencies]
lodelai-crypto = { path = "../crypto" }
lodelai-effects = { path = "../effects" }
lodelai-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
zeroize = "1"
# MLS(묶음 22 §2·§8, ADR 0012) — 0.9 는 rustc 1.91 이 필요해 0.8 줄(0.8.3)로 시작한다.
openmls = "=0.8.3"
openmls_traits = "0.5"
openmls_rust_crypto = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
sha2 = "0.10"
# 알림 tag(relay push::conv_tag 와 같은 HMAC-SHA256)로 대화 찾기(open_push).
hmac = "0.12"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "process", "io-util", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# 원격 relay(#364) TLS — 암호 공급자는 ring 하나(aws-lc 는 빌드에 cmake 가 필요), 루트는 webpki-roots(일반 검증).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
lodelai-relay = { path = "../../services/relay" }
lodelai-testkit = { path = "../testkit" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
